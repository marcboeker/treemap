name: Treemap
options:
  bundleIdPrefix: one.m8n
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
packages:
  TreemapPackage:
    path: ..
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "26.0"
targets:
  Treemap:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
      - path: Resources/treemap
        buildPhase: resources
    dependencies:
      - package: TreemapPackage
        product: TreemapCore
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Treemap
        CFBundleName: Treemap
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "26.0"
        LSApplicationCategoryType: public.app-category.utilities
        NSHighResolutionCapable: true
        NSPrincipalClass: NSApplication
        CFBundleDocumentTypes:
          - CFBundleTypeName: Folder
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.folder
    scheme: {}
    entitlements:
      path: Resources/Treemap.entitlements
      properties: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_ID}
        PRODUCT_NAME: Treemap
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_ENTITLEMENTS: Resources/Treemap.entitlements
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Resources/Info.plist
        # Exposes the Metal/Swift shared types (CellInstance, ...) to Swift.
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Map/ShaderTypes.h
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
